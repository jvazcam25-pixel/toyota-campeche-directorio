<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EB0A1E" />
  <meta name="description" content="Directorio de atención de Toyota Campeche" />
  <title>Toyota Campeche · Directorio de atención</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-media" role="img" aria-label="Fachada de Toyota Campeche">
        <div class="hero-overlay"></div>
      </div>

      <div class="brand-panel">
        <img class="brand-logo" src="assets/toyota-logo.jpg" alt="Toyota" />
        <p>Directorio de atención</p>
      </div>
    </section>

    <section class="quick-actions section-card" aria-label="Accesos rápidos">
      <a class="quick-action" id="quick-location" href="#" target="_blank" rel="noreferrer">
        <span class="quick-icon" data-icon="location"></span>
        <span>Ubicación</span>
      </a>
      <button class="quick-action quick-button" type="button" data-jump-area="comercial" data-jump-contact="gerente-atencion-clientes">
        <span class="quick-icon" data-icon="headset"></span>
        <span>Atención a clientes</span>
      </button>
      <button class="quick-action quick-button" type="button" data-open-appointments>
        <span class="quick-icon" data-icon="calendar"></span>
        <span>Citas</span>
      </button>
      <a class="quick-action" id="quick-web" href="#" target="_blank" rel="noreferrer">
        <span class="quick-icon" data-icon="globe"></span>
        <span>Sitio web</span>
      </a>
      <a class="quick-action quick-action-facebook" id="quick-facebook" href="#" target="_blank" rel="noreferrer">
        <span class="quick-icon" data-icon="facebook"></span>
        <span>Facebook</span>
      </a>
    </section>

    <section id="app-view" class="app-view" aria-live="polite"></section>

    <footer>
      <p><strong>Toyota Campeche</strong> · Directorio digital</p>
      <p class="footer-note">Los nombres y datos de esta versión son de ejemplo y pueden editarse en data.js.</p>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
